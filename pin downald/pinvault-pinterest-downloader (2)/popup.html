<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PinVault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111827;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e60023, #ff4d4f);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid #f3f4f6;
      font-size: 13px;
    }
    .row label { cursor: pointer; color: #374151; }
    .row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #e60023;
      cursor: pointer;
    }
    .stats {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f9fafb;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
    }
    .stats strong { color: #111827; }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">P</div>
    <div>
      <h1>PinVault HD</h1>
      <div class="sub">Pinterest Image &amp; Video Downloader</div>
    </div>
  </div>

  <div class="status">
    <span class="dot"></span>
    Ready — hover any Pin to download
  </div>

  <div class="row">
    <label for="useSubfolder">Save in "Pinterest/" folder</label>
    <input type="checkbox" id="useSubfolder" checked>
  </div>

  <div class="stats">
    <div>Downloaded: <strong id="dlCount">0</strong> files</div>
    <div id="lastFileRow" style="display:none; word-break:break-all;">Last: <strong id="lastFile"></strong></div>
  </div>

  <div class="hint">
    No need to open this popup — just hover any image or video on Pinterest and click the bottom-left <strong>HD</strong> button.
  </div>

  <script src="popup.js"></script>
</body>
</html>
